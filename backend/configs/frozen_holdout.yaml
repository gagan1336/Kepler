# KEPLER — Frozen Holdout Set
# ==============================
# Permanently reserved for evaluation ONLY.
# These tickers must NEVER appear in any training, feature-fitting,
# hyperparameter selection, or SMOTE resampling step.
#
# Selected: all of NIFTY_500_EXTRA (genuinely never trained on in any phase)
# plus additional Nifty500 names to reach ~15% of the 500-stock universe.
#
# HARD RULE: if a frozen ticker ever appears in a training file, the
# test suite in tests/test_no_holdout_leakage.py will fail the build.
# Do not add these to NIFTY_200_EXTRA or NIFTY_500_EXTRA in train_model.py.

